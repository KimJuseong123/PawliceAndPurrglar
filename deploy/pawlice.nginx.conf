# The game and the voice API on one origin.
#
# One origin is not tidiness, it is a requirement. The page is https, so a call
# to http://localhost:3000 is blocked outright by the browser, and the
# microphone does not exist at all outside a secure context. Serving the API
# under /api on the same host means the WebGL build resolves its backend from
# its own URL and has no address compiled into it.
#
# There is no game port here. Matches go through Unity Relay, so nothing but
# 80 and 443 is ever open — see docs/21_REMOTE_PLAY_AND_DEPLOY.md.
#
# The TLS lines are Certbot's and are rewritten by it on renewal. Everything
# above them is ours. Installed by deploy/setup-ec2.sh, which fills in the
# certificate paths from whatever Certbot actually issued rather than assuming
# the domain.

# WebSocket upgrades need the Connection header echoed back conditionally: a
# plain "Connection: upgrade" on every request breaks keep-alive for the other
# 99% of them.
map $http_upgrade $pawlice_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name __PAWLICE_DOMAIN__;

    root /srv/pawlice/web;
    index index.html;

    # The voice API and its WebSocket.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pawlice_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A voice command is at most five seconds of audio, but the round trip
        # includes speech-to-text on somebody else's server. The default 60s
        # would cut off a slow transcription and report it as a network error.
        proxy_read_timeout 300s;

        # Audio uploads. The server enforces its own limit; this only has to be
        # above it, or nginx refuses the request before the server can explain
        # why.
        client_max_body_size 12m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }

    # The Unity payload is named per build, so a browser that already has it
    # must never ask again. index.html is deliberately not covered: it is what
    # tells the browser which build to fetch.
    location /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /StreamingAssets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Already compressed inside their own container. Running gzip over them
    # again costs CPU on a 1.8GB instance and saves nothing.
    gzip on;
    gzip_types text/css text/plain application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
